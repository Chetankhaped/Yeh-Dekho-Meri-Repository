<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeh-Dekho-Meri-Repository</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">

    <!-- Animated background canvas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Top bar -->
    <nav class="topbar">
        <a href="#" class="topbar-logo">
            <span class="logo-bracket">&lt;</span>YDMR<span class="logo-bracket">/&gt;</span>
        </a>
        <div class="topbar-actions">
            <a href="https://github.com/Chetankhaped" target="_blank" rel="noopener" class="topbar-link" title="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <button id="theme-toggle" aria-label="Toggle theme">
                <i class="fas fa-sun"></i>
            </button>
        </div>
    </nav>

    <!-- Hero -->
    <header class="hero">
        <div class="hero-inner">
            <p class="hero-greeting">Welcome to</p>
            <h1 class="hero-name">Yeh-Dekho-Meri-Repository</h1>
            <div class="hero-typed-wrap">
                <span class="hero-cursor">$</span>
                <span id="typed-text" class="hero-typed"></span>
                <span class="blink-caret">|</span>
            </div>
            <p class="hero-sub">Engineering projects — from IoT security to AI-powered platforms.</p>
            <a href="#projects" class="hero-cta">
                <span>Explore Projects</span>
                <i class="fas fa-arrow-down"></i>
            </a>
        </div>
    </header>

    <!-- Stats ribbon -->
    <div class="stats-ribbon">
        <div class="stat" id="stat-projects">
            <span class="stat-num">—</span>
            <span class="stat-label">Projects</span>
        </div>
        <div class="stat" id="stat-tech">
            <span class="stat-num">—</span>
            <span class="stat-label">Technologies</span>
        </div>
        <div class="stat" id="stat-lines">
            <span class="stat-num">—</span>
            <span class="stat-label">Lines of Code</span>
        </div>
    </div>

    <!-- Terminal + Project cards -->
    <section id="projects" class="projects-section">
        <h2 class="section-heading">
            <span class="heading-decoration">//</span> Projects
        </h2>

        <!-- Live terminal -->
        <div class="terminal-window">
            <div class="terminal-chrome">
                <span class="term-dot dot-r"></span>
                <span class="term-dot dot-y"></span>
                <span class="term-dot dot-g"></span>
                <span class="terminal-tab"><i class="fas fa-terminal"></i> ~/projects</span>
            </div>
            <div class="terminal-body" id="terminal">
                <p class="t-line"><span class="t-prompt">$</span> cat projects.json | jq length</p>
                <div class="t-spinner" id="spinner">⠋</div>
            </div>
        </div>

        <!-- Filter bar -->
        <div class="filter-bar" id="filter-bar"></div>

        <!-- Grid -->
        <div class="projects-grid" id="projects-grid"></div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <p>Built with <span class="footer-heart">&lt;3</span> &mdash; YDMR &mdash; <a href="https://github.com/Chetankhaped/Yeh-Dekho-Meri-Repository" target="_blank" rel="noopener">source on GitHub</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
